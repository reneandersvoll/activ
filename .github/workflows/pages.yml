name: Deploy Web-App
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Game zusammensuchen
        run: |
          IDX=$(find Activ-iOS -name index.html -not -path "*/node_modules/*" -not -path "*/ios/*" | head -n 1)
          mkdir site
          cp -R "$(dirname "$IDX")"/. site/
          test -f site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
