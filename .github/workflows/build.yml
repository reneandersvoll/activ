name: Build iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Game nach www kopieren
        run: |
          IDX=$(find Activ-iOS -name index.html -not -path "*/node_modules/*" -not -path "*/ios/*" | head -n 1)
          if [ -n "$IDX" ]; then
            echo "Gefunden: $IDX"
            rm -rf www && mkdir www
            cp -R "$(dirname "$IDX")"/. www/
          fi
          test -f www/index.html || (echo "FEHLER: keine index.html gefunden" && exit 1)
      - run: npm install
      - run: '[ -d ios ] || npx cap add ios'
      - run: npx cap sync ios
      - name: Build
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Activ.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Activ-ipa
          path: ios/App/Activ.ipa
